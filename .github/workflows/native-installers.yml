name: Native installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 22

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64

      - name: Build web application
        shell: pwsh
        run: |
          Set-Location web
          bun install --frozen-lockfile
          bun run build

      - name: Assemble native bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/native/bin | Out-Null
          go build -trimpath -ldflags "-s -w" -o dist/native/bin/server.exe .
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/native/bin/launcher.exe ./cmd/desktop-launcher
          $node = (Get-Command node).Source
          node scripts/native/assemble-bundle.mjs --target windows --output dist/native/windows-bundle --server dist/native/bin/server.exe --launcher dist/native/bin/launcher.exe --node $node

      - name: Smoke test native bundle
        shell: pwsh
        run: |
          $bundle = (Resolve-Path dist/native/windows-bundle).Path
          $data = Join-Path $env:RUNNER_TEMP "ai-workbench-native-data"
          & "$bundle/launcher.exe" --action start --app-dir "$bundle" --data-dir "$data" --no-browser --no-dialog --wait-timeout 180
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem "$data/logs" -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "=== $($_.Name) ==="; Get-Content $_.FullName }
            throw "First startup failed"
          }
          $first = Get-Content "$data/run/state.json" -Raw | ConvertFrom-Json
          Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$($first.webPort)/" -TimeoutSec 10 | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$($first.apiPort)/api/health" -TimeoutSec 10 | Out-Null
          & "$bundle/launcher.exe" --action start --app-dir "$bundle" --data-dir "$data" --no-browser --no-dialog
          if ($LASTEXITCODE -ne 0) { throw "Repeated startup failed" }
          $second = Get-Content "$data/run/state.json" -Raw | ConvertFrom-Json
          if ($first.apiPid -ne $second.apiPid -or $first.webPid -ne $second.webPid) { throw "Repeated startup created duplicate processes" }
          if (-not (Test-Path "$data/data/infinite-canvas.db")) { throw "SQLite data was not created" }
          & "$bundle/launcher.exe" --action stop --app-dir "$bundle" --data-dir "$data" --no-dialog
          if ($LASTEXITCODE -ne 0) { throw "Stop failed" }
          Start-Sleep -Seconds 2
          if (Get-Process -Id $first.apiPid -ErrorAction SilentlyContinue) { throw "API process is still running" }
          if (Get-Process -Id $first.webPid -ErrorAction SilentlyContinue) { throw "Web process is still running" }

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Get-Content VERSION -Raw).Trim().TrimStart('v')
          $source = (Resolve-Path dist/native/windows-bundle).Path
          $output = (Resolve-Path dist/native).Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "/DSourceDir=$source" "/DOutputDir=$output" "packaging\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $setup = Get-ChildItem dist/native/*Windows-x64-Setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content -Encoding ascii "$($setup.FullName).sha256"

      - name: Verify silent installation
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/native/*Windows-x64-Setup.exe | Select-Object -First 1
          $install = Join-Path $env:RUNNER_TEMP "ai-workbench-installed"
          $process = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path "$install/launcher.exe")) { throw "Silent installation failed" }
          $data = Join-Path $env:RUNNER_TEMP "ai-workbench-installed-data"
          & "$install/launcher.exe" --action start --data-dir "$data" --no-browser --no-dialog --wait-timeout 180
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem "$data/logs" -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "=== $($_.Name) ==="; Get-Content $_.FullName }
            throw "Installed application failed to start"
          }
          $state = Get-Content "$data/run/state.json" -Raw | ConvertFrom-Json
          Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$($state.webPort)/" -TimeoutSec 10 | Out-Null
          & "$install/launcher.exe" --action stop --data-dir "$data" --no-dialog
          if ($LASTEXITCODE -ne 0) { throw "Installed application failed to stop" }
          $uninstaller = Get-ChildItem "$install/unins*.exe" | Select-Object -First 1
          Start-Process $uninstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait

      - uses: actions/upload-artifact@v4
        with:
          name: native-installer-windows-x64
          path: |
            dist/native/*Windows-x64-Setup.exe
            dist/native/*Windows-x64-Setup.exe.sha256
          if-no-files-found: error

  macos-apple-silicon:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: arm64

      - name: Build web application
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Assemble native bundle
        run: |
          mkdir -p dist/native/bin
          go build -trimpath -ldflags "-s -w" -o dist/native/bin/server .
          go build -trimpath -ldflags "-s -w" -o dist/native/bin/launcher ./cmd/desktop-launcher
          node scripts/native/assemble-bundle.mjs --target macos --output dist/native/macos-bundle --server dist/native/bin/server --launcher dist/native/bin/launcher --node "$(command -v node)"

      - name: Smoke test native bundle
        run: |
          bundle="$PWD/dist/native/macos-bundle"
          data="$RUNNER_TEMP/ai-workbench-native-data"
          "$bundle/launcher" --action start --app-dir "$bundle" --data-dir "$data" --no-browser --no-dialog --wait-timeout 180
          first_api_pid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["apiPid"])' "$data/run/state.json")"
          first_web_pid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["webPid"])' "$data/run/state.json")"
          api_port="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["apiPort"])' "$data/run/state.json")"
          web_port="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["webPort"])' "$data/run/state.json")"
          curl -fsS "http://127.0.0.1:$api_port/api/health"
          curl -fsS -o /dev/null "http://127.0.0.1:$web_port/"
          "$bundle/launcher" --action start --app-dir "$bundle" --data-dir "$data" --no-browser --no-dialog
          second_api_pid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["apiPid"])' "$data/run/state.json")"
          second_web_pid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["webPid"])' "$data/run/state.json")"
          test "$first_api_pid" = "$second_api_pid"
          test "$first_web_pid" = "$second_web_pid"
          test -f "$data/data/infinite-canvas.db"
          "$bundle/launcher" --action stop --app-dir "$bundle" --data-dir "$data" --no-dialog
          sleep 2
          ! kill -0 "$first_api_pid" 2>/dev/null
          ! kill -0 "$first_web_pid" 2>/dev/null

      - name: Build and verify macOS DMG
        run: |
          chmod +x packaging/macos/build-dmg.sh
          version="$(tr -d '\r\n' < VERSION | sed 's/^v//')"
          packaging/macos/build-dmg.sh "$PWD/dist/native/macos-bundle" "$PWD/dist/native" "$version"
          mkdir -p "$RUNNER_TEMP/ai-workbench-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/ai-workbench-dmg" dist/native/*macOS-Apple-Silicon.dmg
          test -x "$RUNNER_TEMP/ai-workbench-dmg/AI创作工作台.app/Contents/MacOS/ai-creative-workbench"
          test -x "$RUNNER_TEMP/ai-workbench-dmg/停止AI创作工作台.app/Contents/MacOS/stop-launcher"
          codesign --verify --deep --strict "$RUNNER_TEMP/ai-workbench-dmg/AI创作工作台.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/ai-workbench-dmg/停止AI创作工作台.app"
          installed_data="$RUNNER_TEMP/ai-workbench-installed-data"
          "$RUNNER_TEMP/ai-workbench-dmg/AI创作工作台.app/Contents/MacOS/ai-creative-workbench" --data-dir "$installed_data" --no-browser --no-dialog --wait-timeout 180
          installed_web_port="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["webPort"])' "$installed_data/run/state.json")"
          curl -fsS -o /dev/null "http://127.0.0.1:$installed_web_port/"
          INFINITE_CANVAS_DATA_DIR="$installed_data" "$RUNNER_TEMP/ai-workbench-dmg/停止AI创作工作台.app/Contents/MacOS/stop-launcher" --no-dialog
          hdiutil detach "$RUNNER_TEMP/ai-workbench-dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: native-installer-macos-apple-silicon
          path: |
            dist/native/*macOS-Apple-Silicon.dmg
            dist/native/*macOS-Apple-Silicon.dmg.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, macos-apple-silicon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: native-installer-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.sha256
          generate_release_notes: true
